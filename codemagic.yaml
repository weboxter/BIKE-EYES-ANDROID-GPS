
workflows:
  bike-eyes-android:
    name: BIKE EYES Android APK
    max_build_duration: 120
    instance_type: linux_x2

    scripts:
      - name: Check Gradle
        script: gradle --version

      - name: Build debug APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

workflows:
  bike-eyes-android:
    name: BIKE EYES Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Check Java and Gradle
        script: |
          java -version
          gradle --version

      - name: Build Android debug APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk